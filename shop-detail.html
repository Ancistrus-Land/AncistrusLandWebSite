<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Product Details - Ancistrus Land</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;800&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/aquarium.css" rel="stylesheet">
    <link href="css/modern-theme.css" rel="stylesheet">
    <script src="js/products.js"></script>
    <script type="module" src="js/layout.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <!-- Hidden elements for dynamic script bindings -->
    <span id="prod-header-title" class="d-none">Product Details</span>
    <span id="prod-breadcrumb" class="d-none">Detail</span>

    <div class="container-fluid pb-5" style="margin-top: 95px;">
        <div class="container pb-4">
            <div id="product-detail-view" class="anc-glass-card mb-5">
                <!-- Dynamically populated -->
            </div>

            <!-- Related Products -->
            <div class="mt-4">
                <div class="d-inline-block px-3 py-1 mb-3 rounded-pill" style="background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.8);">
                    <h4 class="fw-bold mb-0 text-dark"><i class="fas fa-fish text-primary me-2"></i>Related Aquatic Pets</h4>
                </div>
                <div class="row g-4" id="related-products-grid">
                    <!-- Dynamic related -->
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        let currentProduct = null;
        let qty = 1;

        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get("id");
            const catalog = getActiveCatalog();

            currentProduct = catalog.find(p => p.id === productId) || catalog[0];

            if (!currentProduct) {
                document.getElementById("product-detail-view").innerHTML = `
                    <div class="col-12 text-center py-5">
                        <h3>Product not found</h3>
                        <a href="shop.html" class="btn btn-primary rounded-pill px-4 text-white">Back to Shop</a>
                    </div>
                `;
                return;
            }

            document.getElementById("prod-header-title").textContent = currentProduct.name;
            document.getElementById("prod-breadcrumb").textContent = currentProduct.name;

            const isAvail = currentProduct.available !== false;
            const container = document.getElementById("product-detail-view");

            container.innerHTML = `
                <div class="row g-4 align-items-center">
                    <div class="col-lg-6">
                        <div class="position-relative overflow-hidden rounded-3 shadow-sm border border-light" style="border-radius: 16px; aspect-ratio: 4 / 3; width: 100%;">
                            <img src="${currentProduct.image || 'img/Fish 1.jpg'}" class="img-fluid w-100 h-100" style="object-fit: cover; display: block;" alt="${currentProduct.name}" onerror="this.src='img/Fish 1.jpg'">
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
                            <span class="badge bg-primary text-uppercase px-3 py-1 rounded-pill">${currentProduct.category}</span>
                            ${currentProduct.subcategory ? `<span class="badge bg-light text-dark border px-3 py-1 rounded-pill">${currentProduct.subcategory}</span>` : ''}
                            <span class="ms-auto badge ${isAvail ? 'bg-success' : 'bg-danger'} px-3 py-1 rounded-pill">${isAvail ? 'In Stock' : 'Out of Stock'}</span>
                        </div>

                        <h2 class="fw-bold mb-2 text-dark">${currentProduct.name}</h2>
                        <h3 class="fw-bold text-primary mb-3">${formatPrice(currentProduct.price)}</h3>

                        <p class="mb-3 text-muted" style="line-height: 1.6;">${currentProduct.description || "Premium aquarium pet carefully quarantine-checked, disease-free, and acclimated to local water conditions. Guaranteed live arrival with proper packing."}</p>

                        <!-- Water Parameters & Care Specs -->
                        <div class="p-3 mb-4 rounded-3 border" style="background: rgba(0, 119, 182, 0.04); border-color: rgba(0, 180, 216, 0.25) !important; border-radius: 14px;">
                            <h6 class="fw-bold text-dark mb-2"><i class="fas fa-water text-primary me-2"></i>Recommended Parameters:</h6>
                            <div class="row g-2 small text-muted">
                                <div class="col-sm-6">&bull; Temperature: 24&deg;C - 28&deg;C</div>
                                <div class="col-sm-6">&bull; pH Level: 6.5 - 7.5</div>
                                <div class="col-sm-6">&bull; Diet: High-protein flakes/pellets &amp; frozen</div>
                                <div class="col-sm-6">&bull; Temperament: Peaceful community</div>
                            </div>
                        </div>

                        ${isAvail ? `
                            <div class="d-flex align-items-center mb-4 flex-wrap gap-3">
                                <div class="input-group quantity" style="width: 130px;">
                                    <button class="btn btn-sm btn-minus rounded-circle bg-light border" onclick="updateQty(-1)">
                                        <i class="fa fa-minus"></i>
                                    </button>
                                    <input type="text" id="detail-qty-input" class="form-control form-control-sm text-center border-0 bg-transparent fw-bold" value="1" readonly>
                                    <button class="btn btn-sm btn-plus rounded-circle bg-light border" onclick="updateQty(1)">
                                        <i class="fa fa-plus"></i>
                                    </button>
                                </div>
                                <button onclick="handleAddToCart()" class="btn btn-primary rounded-pill px-4 py-2 text-white shadow-sm">
                                    <i class="fa fa-shopping-bag me-2"></i> Add to Cart
                                </button>
                            </div>
                        ` : `
                            <div class="alert alert-warning py-2 mb-4">Currently out of stock. Check back soon or contact us via WhatsApp for next restock date.</div>
                        `}

                        <div class="border-top pt-3 text-muted">
                            <p class="mb-1 small"><strong>SKU:</strong> ${currentProduct.id}</p>
                            <p class="mb-1 small"><strong>Safe Packaging:</strong> Insulated box + Oxygen breathing bag</p>
                            <p class="mb-0 small text-success"><i class="fas fa-shield-alt me-1"></i> Live Arrival Guarantee backed</p>
                        </div>
                    </div>
                </div>
            `;

            // Render Related Products
            const related = catalog.filter(p => p.category === currentProduct.category && p.id !== currentProduct.id).slice(0, 4);
            const relatedGrid = document.getElementById("related-products-grid");
            if (related.length > 0) {
                relatedGrid.innerHTML = related.map(p => `
                    <div class="col-md-6 col-lg-3">
                        <div class="fruite-item rounded position-relative d-flex flex-column h-100 overflow-hidden">
                            <div class="fruite-img position-relative" style="aspect-ratio: 4 / 3; width: 100%; overflow: hidden;">
                                <a href="shop-detail.html?id=${p.id}">
                                    <img src="${p.image || 'img/Fish 1.jpg'}" class="img-fluid w-100 h-100" style="object-fit: cover; display: block;" alt="${p.name}" onerror="this.src='img/Fish 1.jpg'">
                                </a>
                                <div class="text-white bg-primary px-2 py-1 rounded position-absolute small" style="top: 8px; left: 8px; font-size: 11px; z-index: 2;">
                                    ${p.subcategory || p.category}
                                </div>
                            </div>
                            <div class="p-3 d-flex flex-column flex-grow-1">
                                <h6 class="mb-2"><a href="shop-detail.html?id=${p.id}" class="text-dark fw-bold">${p.name}</a></h6>
                                <div class="d-flex justify-content-between align-items-center mt-auto pt-2">
                                    <span class="fw-bold text-dark fs-6">${formatPrice(p.price)}</span>
                                    <a href="shop-detail.html?id=${p.id}" class="btn btn-sm btn-outline-primary rounded-pill px-3">View</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join("");
            } else {
                relatedGrid.parentElement.style.display = "none";
            }
        });

        function updateQty(delta) {
            qty = Math.max(1, qty + delta);
            document.getElementById("detail-qty-input").value = qty;
        }

        function handleAddToCart() {
            if (currentProduct) {
                addToCart(currentProduct.id, qty);
            }
        }
    </script>
</body>
</html>
