<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Shop - Ancistrus Land</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;800&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/aquarium.css" rel="stylesheet">
    <link href="css/modern-theme.css" rel="stylesheet">
    <script src="js/products.js"></script>
    <script type="module" src="js/layout.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <!-- Hidden hook for dynamic JS filters -->
    <span id="page-title" class="d-none"></span>
    <span id="breadcrumb-active" class="d-none">Shop</span>

    <div class="container-fluid fruite pb-5" style="margin-top: 95px;">
        <div class="container pb-4">
            <div class="row g-4">
                <div class="col-lg-12">
                    <div class="row g-3 align-items-center mb-3">
                        <div class="col-xl-4">
                            <div class="input-group">
                                <input type="search" id="search-input" class="form-control p-2 ps-3 rounded-start" placeholder="Search fish, shrimp, supplies..." oninput="handleSearch()">
                                <button class="btn btn-primary text-white px-3" onclick="handleSearch()"><i class="fa fa-search"></i></button>
                            </div>
                        </div>
                        <div class="col-xl-4 text-center">
                            <span id="product-count" class="text-dark fw-bold">Showing items</span>
                        </div>
                        <div class="col-xl-4">
                            <div class="anc-glass-card py-2 px-3 d-flex justify-content-between align-items-center">
                                <label for="sort-select" class="my-auto fw-bold text-dark small">Sort By:</label>
                                <select id="sort-select" class="border-0 form-select-sm bg-transparent text-dark fw-bold me-2" onchange="applyFilters()">
                                    <option value="default">Default Order</option>
                                    <option value="price-asc">Price: Low to High</option>
                                    <option value="price-desc">Price: High to Low</option>
                                    <option value="name-asc">Name: A to Z</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3">
                        <!-- Sidebar Categories -->
                        <div class="col-lg-3">
                            <div class="anc-glass-card mb-3">
                                <h5 class="fw-bold mb-3 text-dark">Categories</h5>
                                <ul class="list-unstyled fruite-categorie mb-0" id="category-filter-list">
                                    <li class="py-1">
                                        <div class="d-flex justify-content-between fruite-name">
                                            <a href="shop.html" class="category-link active" data-cat="all"><i class="fas fa-water me-2"></i>All Products</a>
                                            <span id="count-all">(0)</span>
                                        </div>
                                    </li>
                                    <li class="py-1">
                                        <div class="d-flex justify-content-between fruite-name">
                                            <a href="shop.html?category=fish" class="category-link" data-cat="fish"><i class="fas fa-fish me-2"></i>Fish</a>
                                            <span id="count-fish">(0)</span>
                                        </div>
                                    </li>
                                    <li class="py-1">
                                        <div class="d-flex justify-content-between fruite-name">
                                            <a href="shop.html?category=invertebrate" class="category-link" data-cat="invertebrate"><i class="fas fa-shield-alt me-2"></i>Invertebrates</a>
                                            <span id="count-invertebrate">(0)</span>
                                        </div>
                                    </li>
                                    <li class="py-1">
                                        <div class="d-flex justify-content-between fruite-name">
                                            <a href="shop.html?category=plants" class="category-link" data-cat="plants"><i class="fas fa-seedling me-2"></i>Live Plants</a>
                                            <span id="count-plants">(0)</span>
                                        </div>
                                    </li>
                                    <li class="py-1">
                                        <div class="d-flex justify-content-between fruite-name">
                                            <a href="shop.html?category=dry-goods" class="category-link" data-cat="dry-goods"><i class="fas fa-box me-2"></i>Dry Goods</a>
                                            <span id="count-dry-goods">(0)</span>
                                        </div>
                                    </li>
                                </ul>
                            </div>

                            <div class="anc-glass-card mb-3">
                                <h5 class="fw-bold mb-2 text-dark">Live Arrival Guarantee</h5>
                                <p class="small text-muted mb-0">All livestock is packed in thermo-regulated boxes with 100% pure oxygen. Fast, safe delivery to your doorstep.</p>
                            </div>
                        </div>

                        <!-- Product Grid -->
                        <div class="col-lg-9">
                            <div class="row g-4" id="products-grid">
                                <!-- Dynamic items rendered here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        let allProducts = [];
        let filteredProducts = [];

        function initShop() {
            if (typeof getActiveCatalog === "function") {
                allProducts = getActiveCatalog();
            } else if (typeof CatalogService !== "undefined" && CatalogService.getAll) {
                allProducts = CatalogService.getAll();
            } else if (typeof ANCISTRUS_PRODUCTS !== "undefined") {
                allProducts = ANCISTRUS_PRODUCTS;
            } else {
                setTimeout(initShop, 50);
                return;
            }

            // Count per category
            document.getElementById("count-all").textContent = `(${allProducts.length})`;
            document.getElementById("count-fish").textContent = `(${allProducts.filter(p => p.category === 'fish').length})`;
            document.getElementById("count-invertebrate").textContent = `(${allProducts.filter(p => p.category === 'invertebrate').length})`;
            document.getElementById("count-plants").textContent = `(${allProducts.filter(p => p.category === 'plants').length})`;
            document.getElementById("count-dry-goods").textContent = `(${allProducts.filter(p => p.category === 'dry-goods').length})`;

            applyFilters();
        }

        function applyFilters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryParam = urlParams.get("category");
            const subcategoryParam = urlParams.get("subcategory");
            const searchVal = (document.getElementById("search-input").value || "").toLowerCase().trim();
            const sortVal = document.getElementById("sort-select").value;

            filteredProducts = allProducts.filter(p => {
                if (categoryParam && p.category !== categoryParam) return false;
                if (subcategoryParam && p.subcategory !== subcategoryParam) return false;
                if (searchVal) {
                    const matchName = (p.name || "").toLowerCase().includes(searchVal);
                    const matchSub = (p.subcategory || "").toLowerCase().includes(searchVal);
                    if (!matchName && !matchSub) return false;
                }
                return true;
            });

            if (sortVal === "price-asc") {
                filteredProducts.sort((a, b) => (Number(a.price) || 0) - (Number(b.price) || 0));
            } else if (sortVal === "price-desc") {
                filteredProducts.sort((a, b) => (Number(b.price) || 0) - (Number(a.price) || 0));
            } else if (sortVal === "name-asc") {
                filteredProducts.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
            }

            // Update title
            if (subcategoryParam) {
                document.getElementById("page-title").textContent = subcategoryParam.replace(/-/g, ' ').toUpperCase();
            } else if (categoryParam) {
                document.getElementById("page-title").textContent = categoryParam.toUpperCase() + " COLLECTION";
            } else {
                document.getElementById("page-title").textContent = "Aquatic Livestock & Supplies";
            }

            renderProducts();
        }

        function handleSearch() {
            applyFilters();
        }

        function renderProducts() {
            const grid = document.getElementById("products-grid");
            document.getElementById("product-count").textContent = `Showing ${filteredProducts.length} items`;

            if (filteredProducts.length === 0) {
                grid.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fas fa-search fa-3x text-muted mb-3"></i>
                        <h4 class="text-muted">No products found</h4>
                        <p>Try clearing your search or category filters.</p>
                        <a href="shop.html" class="btn btn-primary rounded-pill px-4 text-white">Reset Filters</a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredProducts.map(p => {
                const isAvail = p.available !== false;
                const priceFormatted = formatPrice(p.price);
                const detailUrl = `shop-detail.html?id=${p.id}`;

                return `
                    <div class="col-md-6 col-lg-6 col-xl-4">
                        <div class="rounded position-relative fruite-item border border-secondary border-top-0 d-flex flex-column h-100 overflow-hidden">
                            <div class="fruite-img position-relative" style="aspect-ratio: 4 / 3; width: 100%; overflow: hidden;">
                                <a href="${detailUrl}">
                                    <img src="${p.image || 'img/Fish 1.jpg'}" class="img-fluid w-100 h-100" style="object-fit: cover; display: block;" alt="${p.name}" onerror="this.src='img/Fish 1.jpg'">
                                </a>
                                <div class="text-white bg-secondary px-3 py-1 rounded position-absolute" style="top: 10px; left: 10px; z-index: 2;">
                                    ${p.subcategory || p.category}
                                </div>
                                ${!isAvail ? '<div class="badge bg-danger position-absolute" style="top: 10px; right: 10px; z-index: 2;">Out of Stock</div>' : ''}
                            </div>
                            <div class="p-4 d-flex flex-column flex-grow-1">
                                <h5 class="mb-2"><a href="${detailUrl}" class="text-dark">${p.name}</a></h5>
                                <p class="text-muted small flex-grow-1 mb-3">${(p.description || "Healthy, acclimated aquatic specimen with live arrival guarantee.").substring(0, 75)}...</p>
                                <div class="d-flex justify-content-between align-items-center mt-auto">
                                    <span class="text-dark fs-5 fw-bold mb-0">${priceFormatted}</span>
                                    ${isAvail ? `
                                        <button onclick="addToCart('${p.id}')" class="btn border border-secondary rounded-pill px-3 text-primary">
                                            <i class="fa fa-shopping-bag me-1 text-primary"></i> Add
                                        </button>
                                    ` : `
                                        <button class="btn btn-outline-secondary rounded-pill px-3" disabled>Sold Out</button>
                                    `}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
        }

        document.addEventListener("DOMContentLoaded", initShop);
        window.addEventListener("catalog:updated", initShop);
    </script>
</body>
</html>
