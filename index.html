    <!-- Home Page Fish Products -->
    <script>
        (function () {
            "use strict";

            function escapeHtml(value) {
                return String(value ?? "")
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }

            function formatPrice(price) {
    return `${Number(price || 0).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}

            function renderHomeFishProducts() {
                const carousel = document.getElementById("home-fish-carousel");

                if (!carousel || typeof ANCISTRUS_PRODUCTS === "undefined") {
                    return;
                }

                const fishProducts = ANCISTRUS_PRODUCTS.filter(function (product) {
                    return product.category === "fish";
                });

                if (fishProducts.length === 0) {
                    carousel.innerHTML = `
                        <div class="text-center bg-light rounded p-5">
                            <i class="fas fa-fish fa-3x text-primary mb-3"></i>
                            <h4>No fish products added yet</h4>
                        </div>`;
                    return;
                }

                carousel.innerHTML = fishProducts.map(function (product) {
                    const detailUrl = product.available ? product.detailUrl : "#";
                    const buttonText = product.available ? "View Product" : "Out of Stock";
                    const disabledClass = product.available ? "" : " disabled opacity-50";

                    return `
                        <div class="border border-primary rounded position-relative vesitable-item h-100">
                            <div class="vesitable-img">
                                <img src="${escapeHtml(product.image)}"
                                     class="img-fluid w-100 rounded-top"
                                     alt="${escapeHtml(product.name)}"
                                     onerror="this.src='img/Fish 1.jpg'">
                            </div>

                            <div class="text-white bg-primary px-3 py-1 rounded position-absolute"
                                 style="top:10px;right:10px;">
                                Fish
                            </div>

                            <div class="p-4 rounded-bottom">
                                <h4>${escapeHtml(product.name)}</h4>

                                <p style="
                                    display:-webkit-box;
                                    -webkit-line-clamp:3;
                                    -webkit-box-orient:vertical;
                                    overflow:hidden;
                                    overflow-wrap:anywhere;">
                                    ${escapeHtml(product.description)}
                                </p>

                                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                                    <p class="text-dark fs-5 fw-bold mb-0">
                                        ${formatPrice(product.price)}
                                    </p>

                                    <a href="${escapeHtml(detailUrl)}"
                                       class="btn border border-secondary rounded-pill px-3 text-primary${disabledClass}"
                                       ${product.available ? "" : 'aria-disabled="true"'}>
                                        ${buttonText}
                                    </a>
                                </div>
                            </div>
                        </div>`;
                }).join("");
            }

            function renderHomeBestsellerProducts() {
                const roundedContainer = document.getElementById("home-bestseller-rounded");
                const squareContainer = document.getElementById("home-bestseller-square");

                if (!roundedContainer || !squareContainer ||
                    typeof ANCISTRUS_PRODUCTS === "undefined") {
                    return;
                }

                // Bestseller section shows only products marked bestseller: true.
                // Maximum 10 products:
                // first 6 = rounded-circle style
                // next 4 = square/rounded image style
                const products = ANCISTRUS_PRODUCTS
                    .filter(function (product) {
                        return product.available && product.bestseller === true;
                    })
                    .slice(0, 10);

                const roundedProducts = products.slice(0, 6);
                const squareProducts = products.slice(6, 10);

                roundedContainer.innerHTML = roundedProducts.map(function (product) {
                    const detailUrl = product.detailUrl || "#";

                    return `
                        <div class="col-lg-6 col-xl-4">
                            <div class="p-4 rounded bg-light h-100">
                                <div class="row align-items-center">
                                    <div class="col-6">
                                        <a href="${escapeHtml(detailUrl)}">
                                            <img src="${escapeHtml(product.image)}"
                                                 class="img-fluid rounded-circle w-100"
                                                 style="aspect-ratio:1/1;object-fit:cover;"
                                                 alt="${escapeHtml(product.name)}"
                                                 onerror="this.src='img/Fish 1.jpg'">
                                        </a>
                                    </div>
                                    <div class="col-6">
                                        <a href="${escapeHtml(detailUrl)}" class="h5">
                                            ${escapeHtml(product.name)}
                                        </a>
                                        <div class="d-flex my-3">
                                            <i class="fas fa-star text-primary"></i>
                                            <i class="fas fa-star text-primary"></i>
                                            <i class="fas fa-star text-primary"></i>
                                            <i class="fas fa-star text-primary"></i>
                                            <i class="fas fa-star"></i>
                                        </div>
                                        <h4 class="mb-3">${formatPrice(product.price)}</h4>
                                        <a href="${escapeHtml(detailUrl)}"
                                           class="btn border border-secondary rounded-pill px-3 text-primary">
                                            View Product
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                }).join("");

                squareContainer.innerHTML = squareProducts.map(function (product) {
                    const detailUrl = product.detailUrl || "#";

                    return `
                        <div class="col-md-6 col-lg-6 col-xl-3">
                            <div class="text-center h-100">
                                <a href="${escapeHtml(detailUrl)}">
                                    <img src="${escapeHtml(product.image)}"
                                         class="img-fluid rounded w-100"
                                         style="aspect-ratio:1/1;object-fit:cover;"
                                         alt="${escapeHtml(product.name)}"
                                         onerror="this.src='img/Fish 1.jpg'">
                                </a>
                                <div class="py-4">
                                    <a href="${escapeHtml(detailUrl)}" class="h5">
                                        ${escapeHtml(product.name)}
                                    </a>
                                    <div class="d-flex my-3 justify-content-center">
                                        <i class="fas fa-star text-primary"></i>
                                        <i class="fas fa-star text-primary"></i>
                                        <i class="fas fa-star text-primary"></i>
                                        <i class="fas fa-star text-primary"></i>
                                        <i class="fas fa-star"></i>
                                    </div>
                                    <h4 class="mb-3">${formatPrice(product.price)}</h4>
                                    <a href="${escapeHtml(detailUrl)}"
                                       class="btn border border-secondary rounded-pill px-3 text-primary">
                                        View Product
                                    </a>
                                </div>
                            </div>
                        </div>`;
                }).join("");
            }

            renderHomeFishProducts();
            renderHomeBestsellerProducts();
        })();
    </script>
