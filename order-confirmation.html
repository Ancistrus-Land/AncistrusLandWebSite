<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Order Confirmation - Ancistrus Land Canada</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;800&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/aquarium.css" rel="stylesheet">
    <link href="css/modern-theme.css" rel="stylesheet">
    <script src="js/products.js"></script>
    <script type="module" src="js/layout.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>

        

    <div class="container-fluid pb-5" style="margin-top: 95px;">
        <div class="container pb-5">
            <div id="confirmation-content" class="mx-auto" style="max-width: 800px;">
                <!-- Dynamically loaded -->
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        function renderConfirmation() {
            const container = document.getElementById("confirmation-content");
            if (typeof STORE_CONFIG === "undefined" || typeof formatPrice !== "function") {
                setTimeout(renderConfirmation, 50);
                return;
            }

            const orderRaw = sessionStorage.getItem("last_order");

            if (!orderRaw) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-receipt fa-3x text-muted mb-3"></i>
                        <h3>No recent order found</h3>
                        <p class="text-muted">You can review our catalogue and place an order anytime.</p>
                        <a href="shop.html" class="btn btn-primary rounded-pill px-4 py-2 text-white">Go to Shop</a>
                    </div>
                `;
                return;
            }

            const order = JSON.parse(orderRaw);
            const c = order.customer;

            // Generate Canadian order notification for WhatsApp
            let waText = `*NEW ORDER - ANCESTRUS LAND CANADA*\n`;
            waText += `*Order ID:* ${order.orderId}\n`;
            waText += `*Customer:* ${c.name}\n`;
            waText += `*Phone:* ${c.phone}\n`;
            waText += `*Email:* ${c.email}\n`;
            waText += `*Address:* ${c.address}, ${c.city}, ${c.province} (${c.postalCode})\n`;
            waText += `*Payment:* ${c.paymentMethod}\n`;
            if (c.notes) waText += `*Notes:* ${c.notes}\n`;
            waText += `\n*ITEMS ORDERED:*\n`;
            order.items.forEach(item => {
                waText += `- ${item.name} (x${item.quantity}) - $${(item.price * item.quantity).toFixed(2)}\n`;
            });
            waText += `\n*TOTAL AMOUNT:* $${Number(order.total).toFixed(2)} CAD`;

            const waPhone = STORE_CONFIG.whatsappNumber || "16132665285";
            const waUrl = `https://wa.me/${waPhone}?text=${encodeURIComponent(waText)}`;

            // Generate mailto link
            const emailSubject = `Order ${order.orderId} - ${c.name} (${c.province})`;
            const emailBody = waText.replace(/\*/g, "");
            const storeEmail = STORE_CONFIG.email || "sudarsha.wijenayake@gmail.com";
            const storePhone = STORE_CONFIG.phoneDisplay || "+1 (613) 266-5285";
            const mailtoUrl = `mailto:${storeEmail}?subject=${encodeURIComponent(emailSubject)}&body=${encodeURIComponent(emailBody)}`;

            container.innerHTML = `
                <div class="anc-glass-card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="display-3 text-success mb-2"><i class="fas fa-check-circle"></i></div>
                            <h2 class="fw-bold">Thank You For Your Order!</h2>
                            <p class="text-muted lead">Your order <span class="badge bg-primary text-white fs-6">${order.orderId}</span> has been successfully logged.</p>
                        </div>

                        <!-- Notification Buttons to Store -->
                        <div class="bg-light p-4 rounded mb-4 text-center">
                            <h5 class="fw-bold text-dark mb-2">Instant Dispatch Notification</h5>
                            <p class="small text-muted mb-3">Notify our dispatch team via WhatsApp or Email to ensure immediate packing and next express transit dispatch:</p>
                            <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                                <a href="${waUrl}" target="_blank" class="btn btn-success rounded-pill px-4 py-2">
                                    <i class="fab fa-whatsapp me-2"></i> Send to WhatsApp (${storePhone})
                                </a>
                                <a href="${mailtoUrl}" class="btn btn-primary rounded-pill px-4 py-2 text-white">
                                    <i class="fas fa-envelope me-2"></i> Send to Email (${storeEmail})
                                </a>
                            </div>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <h6 class="text-muted text-uppercase small fw-bold">Customer Shipping Info</h6>
                                <p class="mb-1"><strong>${c.name}</strong></p>
                                <p class="mb-1 text-muted"><i class="fas fa-phone-alt me-2"></i>${c.phone}</p>
                                <p class="mb-1 text-muted"><i class="fas fa-envelope me-2"></i>${c.email}</p>
                                <p class="mb-0 text-muted"><i class="fas fa-map-marker-alt me-2"></i>${c.address}, ${c.city}, ${c.province} (${c.postalCode})</p>
                            </div>
                            <div class="col-md-6">
                                <h6 class="text-muted text-uppercase small fw-bold">Order Details</h6>
                                <p class="mb-1"><strong>Date:</strong> ${order.date}</p>
                                <p class="mb-1"><strong>Payment Selected:</strong> ${c.paymentMethod}</p>
                                <p class="mb-1"><strong>Status:</strong> <span class="badge bg-warning text-dark">Processing for Dispatch</span></p>
                                ${c.notes ? `<p class="mb-0 small text-muted"><strong>Notes:</strong> ${c.notes}</p>` : ''}
                            </div>
                        </div>

                        <div class="table-responsive mb-4">
                            <table class="table">
                                <thead class="table-light">
                                    <tr>
                                        <th>Item</th>
                                        <th>Qty</th>
                                        <th class="text-end">Price (CAD)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${order.items.map(item => `
                                        <tr>
                                            <td>
                                                <strong>${item.name}</strong><br>
                                                <small class="text-muted">${formatPrice(item.price)} each</small>
                                            </td>
                                            <td>x ${item.quantity}</td>
                                            <td class="text-end">${formatPrice(item.price * item.quantity)}</td>
                                        </tr>
                                    `).join("")}
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <th colspan="2" class="text-end">Insulated Packaging &amp; Heat/Ice Pack:</th>
                                        <th class="text-end text-success">Included (FREE)</th>
                                    </tr>
                                    <tr>
                                        <th colspan="2" class="text-end fs-5">Grand Total:</th>
                                        <th class="text-end fs-5 text-primary">${formatPrice(order.total)}</th>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>

                        <div class="text-center pt-3 border-top">
                            <a href="shop.html" class="btn btn-outline-secondary rounded-pill px-4 me-2">Continue Shopping</a>
                            <button onclick="window.print()" class="btn btn-light rounded-pill px-4"><i class="fas fa-print me-1"></i> Print Receipt</button>
                        </div>
                    </div>
                </div>
            `;
        }

        document.addEventListener("DOMContentLoaded", renderConfirmation);
    </script>
</body>
</html>
