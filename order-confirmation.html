<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Order Confirmation - Ancistrus Land Canada</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;800&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/aquarium.css" rel="stylesheet">
    <link href="css/modern-theme.css" rel="stylesheet">
    <script src="js/products.js"></script>
    <script type="module" src="js/layout.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>

        

    <div class="container-fluid pb-5" style="margin-top: 95px;">
        <div class="container pb-5">
            <div id="confirmation-content" class="mx-auto" style="max-width: 800px;">
                <!-- Dynamically loaded -->
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        function renderConfirmation() {
            const container = document.getElementById("confirmation-content");
            if (typeof STORE_CONFIG === "undefined" || typeof formatPrice !== "function") {
                setTimeout(renderConfirmation, 50);
                return;
            }

            const orderRaw = sessionStorage.getItem("last_order");

            if (!orderRaw) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-receipt fa-3x text-muted mb-3"></i>
                        <h3>No recent order found</h3>
                        <p class="text-muted">You can review our catalogue and place an order anytime.</p>
                        <a href="shop.html" class="btn btn-primary rounded-pill px-4 py-2 text-white">Go to Shop</a>
                    </div>
                `;
                return;
            }

            const order = JSON.parse(orderRaw);
            const c = order.customer;

            container.innerHTML = `
                <div class="anc-glass-card receipt-printable-card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <!-- Printed Header (only appears on physical print/PDF) -->
                        <div class="print-receipt-header">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h3 class="fw-bold mb-0">ANCISTRUS LAND CANADA</h3>
                                    <small class="text-muted">Freshwater Wonders &bull; Canada-Wide Aquatic Specialist</small><br>
                                    <small class="text-muted">Ottawa, Ontario | sudarsha.wijenayake@gmail.com | +1 (613) 266-5285</small>
                                </div>
                                <div class="text-end">
                                    <h4 class="fw-bold text-primary mb-0">OFFICIAL RECEIPT</h4>
                                    <small class="fw-bold">Order #${order.orderId}</small><br>
                                    <small class="text-muted">Date: ${order.date}</small>
                                </div>
                            </div>
                        </div>

                        <!-- On-Screen Header (hidden during print) -->
                        <div class="text-center mb-4 print-hide">
                            <div class="display-3 text-success mb-2"><i class="fas fa-check-circle"></i></div>
                            <h2 class="fw-bold">Thank You For Your Order!</h2>
                            <p class="text-muted lead">Your order <span class="badge bg-primary text-white fs-6">${order.orderId}</span> has been confirmed and received.</p>
                            <p class="small text-muted mb-0">A confirmation receipt has been generated. Our team has received your order details and is preparing your aquatic livestock for express transit.</p>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <div class="p-3 rounded-3" style="background: rgba(0, 119, 182, 0.04); border: 1px solid rgba(0, 180, 216, 0.2);">
                                    <h6 class="text-uppercase small fw-bold text-primary mb-2"><i class="fas fa-shipping-fast me-2 print-hide"></i>Shipping & Delivery Address</h6>
                                    <p class="mb-1 fw-bold text-dark">${c.name}</p>
                                    <p class="mb-1 text-muted small"><i class="fas fa-phone-alt me-2 text-primary print-hide"></i>${c.phone}</p>
                                    <p class="mb-1 text-muted small"><i class="fas fa-envelope me-2 text-primary print-hide"></i>${c.email}</p>
                                    <p class="mb-0 text-muted small"><i class="fas fa-map-marker-alt me-2 text-primary print-hide"></i>${c.address}, ${c.city}, ${c.province} (${c.postalCode})</p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="p-3 rounded-3" style="background: rgba(0, 119, 182, 0.04); border: 1px solid rgba(0, 180, 216, 0.2);">
                                    <h6 class="text-uppercase small fw-bold text-primary mb-2"><i class="fas fa-file-invoice me-2 print-hide"></i>Order & Payment Status</h6>
                                    <p class="mb-1 small"><strong>Order Date:</strong> ${order.date}</p>
                                    <p class="mb-1 small"><strong>Payment Method:</strong> ${c.paymentMethod}</p>
                                    <p class="mb-1 small"><strong>Status:</strong> <span class="badge bg-warning text-dark">Processing for Dispatch</span></p>
                                    ${c.notes ? `<p class="mb-0 small text-muted"><strong>Delivery Notes:</strong> ${c.notes}</p>` : ''}
                                </div>
                            </div>
                        </div>

                        ${c.paymentMethod && c.paymentMethod.includes('Interac') ? `
                            <div class="alert alert-info py-2 px-3 small mb-4 rounded-3 d-flex align-items-center">
                                <i class="fas fa-info-circle fa-lg me-2 text-primary print-hide"></i>
                                <div>
                                    <strong>Interac e-Transfer Instructions:</strong> Please send <strong>${formatPrice(order.total)}</strong> to <strong>sudarsha.wijenayake@gmail.com</strong> with Order ID <strong>${order.orderId}</strong> in the message notes.
                                </div>
                            </div>
                        ` : ''}

                        <div class="table-responsive mb-4">
                            <table class="table">
                                <thead class="table-light">
                                    <tr>
                                        <th>Item</th>
                                        <th>Qty</th>
                                        <th class="text-end">Price (CAD)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${order.items.map(item => `
                                        <tr>
                                            <td>
                                                <strong>${item.name}</strong><br>
                                                <small class="text-muted">${formatPrice(item.price)} each</small>
                                            </td>
                                            <td>x ${item.quantity}</td>
                                            <td class="text-end">${formatPrice(item.price * item.quantity)}</td>
                                        </tr>
                                    `).join("")}
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <th colspan="2" class="text-end">Insulated Packaging &amp; Heat/Ice Pack:</th>
                                        <th class="text-end text-success">Included (FREE)</th>
                                    </tr>
                                    <tr>
                                        <th colspan="2" class="text-end fs-5">Grand Total:</th>
                                        <th class="text-end fs-5 text-primary">${formatPrice(order.total)}</th>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>

                        <!-- Footer actions (hidden when printing) -->
                        <div class="text-center pt-3 border-top print-hide">
                            <a href="shop.html" class="btn btn-outline-secondary rounded-pill px-4 me-2">Continue Shopping</a>
                            <button onclick="printCleanReceipt()" class="btn btn-primary rounded-pill px-4 shadow-sm text-white"><i class="fas fa-print me-1"></i> Print Receipt</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function printCleanReceipt() {
            const orderRaw = sessionStorage.getItem("last_order");
            if (!orderRaw) {
                window.print();
                return;
            }
            const order = JSON.parse(orderRaw);
            const c = order.customer;

            const itemsRows = order.items.map(item => `
                <tr>
                    <td style="padding: 10px 12px; border-bottom: 1px solid #e5e7eb;">
                        <strong>${item.name}</strong><br>
                        <span style="font-size: 12px; color: #6b7280;">$${Number(item.price).toFixed(2)} CAD each</span>
                    </td>
                    <td style="padding: 10px 12px; border-bottom: 1px solid #e5e7eb; text-align: center;">${item.quantity}</td>
                    <td style="padding: 10px 12px; border-bottom: 1px solid #e5e7eb; text-align: right; font-weight: 600;">$${(item.price * item.quantity).toFixed(2)}</td>
                </tr>
            `).join("");

            const invoiceHtml = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="utf-8">
                    <title>Receipt - Order #${order.orderId}</title>
                    <style>
                        @page { size: portrait; margin: 15mm; }
                        body {
                            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
                            color: #111827;
                            background: #ffffff;
                            margin: 0;
                            padding: 20px;
                            font-size: 14px;
                            line-height: 1.5;
                        }
                        .receipt-box {
                            max-width: 720px;
                            margin: 0 auto;
                        }
                        .header-row {
                            display: flex;
                            justify-content: space-between;
                            align-items: flex-start;
                            border-bottom: 2px solid #0077b6;
                            padding-bottom: 16px;
                            margin-bottom: 24px;
                        }
                        .brand-title {
                            font-size: 22px;
                            font-weight: 800;
                            color: #0077b6;
                            margin: 0 0 4px 0;
                            letter-spacing: -0.5px;
                        }
                        .brand-sub {
                            font-size: 12px;
                            color: #6b7280;
                            margin: 0;
                        }
                        .receipt-meta {
                            text-align: right;
                        }
                        .receipt-title {
                            font-size: 18px;
                            font-weight: 800;
                            margin: 0 0 4px 0;
                            color: #111827;
                        }
                        .meta-tag {
                            font-size: 12px;
                            color: #4b5563;
                        }
                        .grid-two {
                            display: flex;
                            gap: 20px;
                            margin-bottom: 24px;
                        }
                        .panel {
                            flex: 1;
                            background: #f9fafb;
                            border: 1px solid #e5e7eb;
                            border-radius: 8px;
                            padding: 14px;
                        }
                        .panel-heading {
                            font-size: 11px;
                            text-transform: uppercase;
                            font-weight: 700;
                            color: #0077b6;
                            margin: 0 0 8px 0;
                            letter-spacing: 0.5px;
                        }
                        .table {
                            width: 100%;
                            border-collapse: collapse;
                            margin-bottom: 24px;
                        }
                        .table th {
                            background: #f3f4f6;
                            padding: 10px 12px;
                            text-align: left;
                            font-size: 12px;
                            text-transform: uppercase;
                            letter-spacing: 0.5px;
                            border-bottom: 2px solid #e5e7eb;
                        }
                        .totals-table {
                            width: 100%;
                            border-collapse: collapse;
                            margin-top: 10px;
                        }
                        .totals-table td {
                            padding: 6px 12px;
                        }
                        .grand-total {
                            font-size: 18px;
                            font-weight: 800;
                            color: #0077b6;
                            border-top: 2px solid #0077b6;
                        }
                        .notes-box {
                            background: #f0fdf4;
                            border: 1px solid #bbf7d0;
                            border-radius: 8px;
                            padding: 12px 16px;
                            font-size: 12.5px;
                            color: #166534;
                            margin-bottom: 20px;
                        }
                        .footer {
                            border-top: 1px solid #e5e7eb;
                            padding-top: 16px;
                            font-size: 12px;
                            color: #6b7280;
                            text-align: center;
                        }
                    </style>
                </head>
                <body>
                    <div class="receipt-box">
                        <div class="header-row">
                            <div>
                                <h1 class="brand-title">ANCISTRUS LAND CANADA</h1>
                                <p class="brand-sub">Freshwater Wonders &bull; Canada-Wide Aquatic Specialist</p>
                                <p class="brand-sub">Ottawa, ON &bull; sudarsha.wijenayake@gmail.com &bull; +1 (613) 266-5285</p>
                            </div>
                            <div class="receipt-meta">
                                <div class="receipt-title">ORDER RECEIPT</div>
                                <div class="meta-tag"><strong>Order ID:</strong> ${order.orderId}</div>
                                <div class="meta-tag"><strong>Date:</strong> ${order.date}</div>
                            </div>
                        </div>

                        <div class="grid-two">
                            <div class="panel">
                                <div class="panel-heading">Customer & Shipping Details</div>
                                <div><strong>${c.name}</strong></div>
                                <div style="color: #4b5563; font-size: 13px;">${c.phone}</div>
                                <div style="color: #4b5563; font-size: 13px;">${c.email}</div>
                                <div style="color: #4b5563; font-size: 13px; margin-top: 4px;">
                                    ${c.address}<br>${c.city}, ${c.province} (${c.postalCode})
                                </div>
                            </div>

                            <div class="panel">
                                <div class="panel-heading">Order & Payment Status</div>
                                <div style="font-size: 13px;"><strong>Payment Method:</strong> ${c.paymentMethod}</div>
                                <div style="font-size: 13px; margin-top: 4px;"><strong>Order Status:</strong> Received / Processing</div>
                                ${c.notes ? `<div style="font-size: 12px; color: #4b5563; margin-top: 8px;"><strong>Delivery Notes:</strong> ${c.notes}</div>` : ''}
                            </div>
                        </div>

                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Item Description</th>
                                    <th style="text-align: center;">Qty</th>
                                    <th style="text-align: right;">Price (CAD)</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${itemsRows}
                            </tbody>
                        </table>

                        <table class="totals-table">
                            <tr>
                                <td style="text-align: right; color: #4b5563;">Insulated Thermal Packaging & Heat/Ice Pack:</td>
                                <td style="text-align: right; width: 140px; color: #16a34a; font-weight: 600;">FREE (Included)</td>
                            </tr>
                            <tr>
                                <td class="grand-total" style="text-align: right;">Grand Total:</td>
                                <td class="grand-total" style="text-align: right; width: 140px;">$${Number(order.total).toFixed(2)} CAD</td>
                            </tr>
                        </table>

                        <div class="notes-box" style="margin-top: 20px;">
                            <strong>100% Live Arrival Guarantee (LAG):</strong> All livestock is shipped inside thermo-regulated boxes with oxygen-charged double-sealed bags.
                        </div>

                        <div class="footer">
                            Thank you for choosing Ancistrus Land! If you have any questions regarding your delivery or acclimation, contact us at sudarsha.wijenayake@gmail.com.
                        </div>
                    </div>
                </body>
                </html>
            `;

            // Isolated print iframe (Zero background leak, exact printer document generation)
            const iframe = document.createElement("iframe");
            iframe.style.position = "fixed";
            iframe.style.right = "0";
            iframe.style.bottom = "0";
            iframe.style.width = "0";
            iframe.style.height = "0";
            iframe.style.border = "none";
            document.body.appendChild(iframe);

            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(invoiceHtml);
            doc.close();

            iframe.contentWindow.focus();
            setTimeout(() => {
                iframe.contentWindow.print();
                setTimeout(() => {
                    document.body.removeChild(iframe);
                }, 1000);
            }, 300);
        }

        document.addEventListener("DOMContentLoaded", renderConfirmation);
    </script>
</body>
</html>
