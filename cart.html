<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Shopping Cart - Ancistrus Land</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;800&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/aquarium.css" rel="stylesheet">
    <link href="css/modern-theme.css" rel="stylesheet">
    <script src="js/products.js"></script>
    <script type="module" src="js/layout.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container-fluid pb-5" style="margin-top: 95px;">
        <div class="container pb-4">
            <div id="cart-content">
                <!-- Dynamically loaded -->
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        function renderCartPage() {
            const container = document.getElementById("cart-content");
            if (typeof getCart !== "function") {
                setTimeout(renderCartPage, 50);
                return;
            }
            const cart = getCart();

            if (!cart || cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-shopping-cart fa-4x text-muted mb-3"></i>
                        <h3 class="text-muted">Your cart is currently empty</h3>
                        <p class="mb-4">Explore our healthy aquatic livestock and aquarium supplies!</p>
                        <a href="shop.html" class="btn btn-primary rounded-pill px-4 py-2 text-white">Continue Shopping</a>
                    </div>
                `;
                return;
            }

            let subtotal = 0;
            const rowsHtml = cart.map(item => {
                const itemTotal = (Number(item.price) || 0) * (Number(item.quantity) || 1);
                subtotal += itemTotal;
                return `
                    <tr>
                        <th scope="row">
                            <div class="d-flex align-items-center">
                                <img src="${item.image}" class="img-fluid me-3 rounded" style="width: 76px; aspect-ratio: 4 / 3; object-fit: cover;" alt="${item.name}" onerror="this.src='img/Fish 1.jpg'">
                                <div>
                                    <h6 class="mb-0">${item.name}</h6>
                                    <small class="text-muted">ID: ${item.id}</small>
                                </div>
                            </div>
                        </th>
                        <td class="py-4">
                            <p class="mb-0 mt-2">${formatPrice(item.price)}</p>
                        </td>
                        <td class="py-4">
                            <div class="input-group quantity mt-2" style="width: 120px;">
                                <button class="btn btn-sm btn-minus rounded-circle bg-light border" onclick="changeQty('${item.id}', -1)">
                                    <i class="fa fa-minus"></i>
                                </button>
                                <input type="text" class="form-control form-control-sm text-center border-0" value="${item.quantity}" readonly>
                                <button class="btn btn-sm btn-plus rounded-circle bg-light border" onclick="changeQty('${item.id}', 1)">
                                    <i class="fa fa-plus"></i>
                                </button>
                            </div>
                        </td>
                        <td class="py-4">
                            <p class="mb-0 mt-2 fw-bold">${formatPrice(itemTotal)}</p>
                        </td>
                        <td class="py-4">
                            <button class="btn btn-md rounded-circle bg-light border text-danger mt-2" onclick="deleteItem('${item.id}')" title="Remove item">
                                <i class="fa fa-times"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join("");

            container.innerHTML = `
                <div class="table-responsive anc-glass-card p-3 mb-4">
                    <table class="table mb-0">
                        <thead>
                          <tr>
                            <th scope="col">Products</th>
                            <th scope="col">Price</th>
                            <th scope="col">Quantity</th>
                            <th scope="col">Total</th>
                            <th scope="col">Handle</th>
                          </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>

                <div class="row g-4 justify-content-end mt-4">
                    <div class="col-8"></div>
                    <div class="col-sm-8 col-md-7 col-lg-6 col-xl-4">
                        <div class="anc-glass-card">
                            <h4 class="mb-3 fw-bold">Cart <span class="fw-normal">Summary</span></h4>
                            <div class="d-flex justify-content-between mb-2">
                                <h6 class="mb-0">Subtotal:</h6>
                                <p class="mb-0 fw-bold">${formatPrice(subtotal)}</p>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <h6 class="mb-0">Live Livestock Dispatch:</h6>
                                <p class="mb-0 text-success small fw-bold">Calculated at Checkout</p>
                            </div>
                            <div class="py-2 mb-3 border-top border-bottom d-flex justify-content-between align-items-center">
                                <h5 class="mb-0 fw-bold">Total</h5>
                                <h5 class="mb-0 text-primary fw-bold">${formatPrice(subtotal)}</h5>
                            </div>
                            <div class="d-grid gap-2">
                                <a href="checkout.html" class="btn btn-primary rounded-pill py-2 text-white fw-bold">Proceed to Checkout</a>
                                <a href="shop.html" class="btn btn-outline-secondary rounded-pill py-2 small">Continue Shopping</a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function changeQty(id, delta) {
            const cart = getCart();
            const item = cart.find(i => i.id === id);
            if (item) {
                const newQty = (item.quantity || 1) + delta;
                if (newQty <= 0) {
                    deleteItem(id);
                } else {
                    updateCartQuantity(id, newQty);
                    renderCartPage();
                }
            }
        }

        async function deleteItem(id) {
            const item = (window.getCart ? window.getCart() : []).find(i => i.id === id);
            const itemName = item ? item.name : "this item";

            let confirmed = false;
            if (window.showConfirm) {
                confirmed = await window.showConfirm({
                    title: "Remove Item",
                    message: `Are you sure you want to remove <strong>${itemName}</strong> from your cart?`,
                    confirmText: "Remove",
                    cancelText: "Keep Item",
                    type: "danger"
                });
            } else {
                confirmed = confirm("Remove this item from your cart?");
            }

            if (confirmed) {
                removeFromCart(id);
                renderCartPage();
                if (window.showToast) {
                    showToast(`${itemName} removed from cart.`, "info", "Cart Updated");
                }
            }
        }

        document.addEventListener("DOMContentLoaded", renderCartPage);
    </script>
</body>
</html>
